name: Gerar APK

on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Preparar o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev libffi-dev libssl-dev cmake \
            libcairo2-dev ccache

      - name: Instalar o Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython

      - name: Reaproveitar downloads anteriores
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle
          key: buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-

      - name: Pre-baixar o freetype de um espelho
        run: |
          set -euo pipefail
          git clone --depth 1 -q https://github.com/kivy/python-for-android /tmp/p4a

          VERSAO=$(python3 -c "
          import re
          src = open('/tmp/p4a/pythonforandroid/recipes/freetype/__init__.py').read()
          print(re.search(r'version\s*=\s*.([0-9.]+).', src).group(1))
          ")
          echo "::notice::freetype versao $VERSAO"

          DESTINO="$GITHUB_WORKSPACE/.buildozer/android/platform/build-arm64-v8a/packages/freetype"
          ARQUIVO="$DESTINO/freetype-$VERSAO.tar.gz"
          mkdir -p "$DESTINO"

          OK=0
          for URL in \
            "https://downloads.sourceforge.net/project/freetype/freetype2/$VERSAO/freetype-$VERSAO.tar.gz?use_mirror=autoselect" \
            "https://ftp.osuosl.org/pub/blfs/conglomeration/freetype2/freetype-$VERSAO.tar.gz" \
            "https://distfiles.macports.org/freetype/freetype-$VERSAO.tar.gz" \
            "https://download.savannah.gnu.org/releases/freetype/freetype-$VERSAO.tar.gz"
          do
            echo "--- tentando $URL"
            rm -f "$ARQUIVO"
            if ! curl -fL --retry 3 --retry-delay 5 --max-time 300 -o "$ARQUIVO" "$URL"; then
              echo "    download falhou"
              continue
            fi
            if ! tar -tzf "$ARQUIVO" > /dev/null 2>&1; then
              echo "    arquivo invalido, nao abre como tar.gz"
              rm -f "$ARQUIVO"
              continue
            fi
            echo "    OK: $(du -h "$ARQUIVO" | cut -f1)"
            sha256sum "$ARQUIVO"
            OK=1
            break
          done

          if [ "$OK" != "1" ]; then
            echo "::error::Nenhum espelho do freetype respondeu"
            exit 1
          fi

          touch "$DESTINO/.mark-freetype-$VERSAO.tar.gz"
          ls -la "$DESTINO"

      - name: Compilar o APK
        run: |
          export JAVA_HOME=$(dirname $(dirname $(readlink -f $(which javac))))
          set -o pipefail
          buildozer -v android debug 2>&1 | tee /tmp/build.log

      - name: Resumo do erro
        if: always()
        run: |
          {
            echo "## Onde parou"
            echo ""
            echo '```'
            grep -aE "Downloading .+ from |Building |ERROR|error:|fatal error|Traceback|HTTPError|Command failed|Error code" \
              /tmp/build.log | tail -40
            echo '```'
            echo ""
            echo "## Ultimas 60 linhas"
            echo ""
            echo '```'
            tail -60 /tmp/build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar o APK
        uses: actions/upload-artifact@v4
        with:
          name: iron-ascent-apk
          path: bin/*.apk
          if-no-files-found: error
